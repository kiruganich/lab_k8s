apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for MinIO to be ready..."
              until mc alias set local http://minio:9000 $ACCESS_KEY $SECRET_KEY; do
                echo "MinIO not ready, retrying in 5s..."
                sleep 5
              done
              echo "Creating bucket..."
              mc mb local/uploads --ignore-existing
              echo "Bucket 'uploads' is ready"
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: accessKeyID
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: secretAccessKey