apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: messager
data:
  init-db.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE messager_users' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'messager_users')\gexec
        SELECT 'CREATE DATABASE messager_messages' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'messager_messages')\gexec
        GRANT ALL PRIVILEGES ON DATABASE messager_users TO $POSTGRES_USER;
        GRANT ALL PRIVILEGES ON DATABASE messager_messages TO $POSTGRES_USER;
    EOSQL