apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      # Запускаем миграции ДО старта самого приложения прямо из его образа
      initContainers:
        - name: run-migrations
          image: mablinov2704/user-service:latest
          command: ["sh", "-c", "go install github.com/pressly/goose/v3/cmd/goose@latest && ~/go/bin/goose -dir /app/migrations postgres \"$DB_DSN\" up"]
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: messager-secrets
                  key: USER_DB_DSN
      containers:
        - name: app
          image: mablinov2704/user-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: messager-config
                  key: USER_HTTP_PORT
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: messager-secrets
                  key: USER_DB_DSN
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081