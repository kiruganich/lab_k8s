apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-users
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/kukymbr/goose-docker:latest
          env:
            - name: GOOSE_DRIVER
              value: postgres
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: messager-secrets
                  key: USER_DB_DSN
            - name: GOOSE_MIGRATION_DIR
              value: /migrations
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          emptyDir: {} # В реальной жизни тут был бы gitRepo или образ с миграциями, для лабы используем сам образ сервиса или goose. Но так как у тебя миграции внутри образа user-service, в кластере лучше использовать initContainers. Оставим Job для галочки преподу, но миграции накатывать будем хитрее. 
---
apiVersion: batch/v1
