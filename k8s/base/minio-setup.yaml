apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: workload
                operator: In
                values:
                - system
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: mc
        image: mirror.gcr.io/minio/mc:latest
        command:
        - /bin/sh
        - -c
        - "mc alias set myminio http://minio:9000 admin password && mc mb myminio/uploads || true"
      restartPolicy: OnFailure
