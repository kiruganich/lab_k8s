apiVersion: v1
kind: ConfigMap
metadata:
  name: messager-config
data:
  FRONTEND_BFF_URL: ""
  FRONTEND_BFF_INTERNAL_URL: "http://bff:8080"
  BFF_HTTP_PORT: "8080"
  USER_HTTP_PORT: "8081"
  MSG_HTTP_PORT: "8082"
  USER_SERVICE_URL: "http://user-service:8081"
  MSG_SERVICE_URL: "http://message-service:8082"
  MSG_UPLOADS_DIR: "/app/uploads"
  POSTGRES_DB: "messager"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
data:
  init-db.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE DATABASE messager_users;
      CREATE DATABASE messager_messages;
      GRANT ALL PRIVILEGES ON DATABASE messager_users TO messager;
      GRANT ALL PRIVILEGES ON DATABASE messager_messages TO messager;
    EOSQL