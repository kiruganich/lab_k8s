apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: messager-dev

replicas:
- name: frontend
  count: 1
- name: bff
  count: 1
- name: user-service
  count: 1
- name: message-service
  count: 1

patches:
- path: patch-resources.yaml
- target:
    kind: Deployment
    name: message-service
  patch: |-
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: uploads
        emptyDir: {}