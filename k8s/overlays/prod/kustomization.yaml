apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: messager-prod

namePrefix: prod-

replicas:
- name: frontend
  count: 2
- name: bff
  count: 2
- name: user-service
  count: 2
- name: message-service
  count: 2

patches:
- path: patch-resources.yaml
- target:
    kind: Deployment
    name: frontend
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "http://prod-bff:8080"
- target:
    kind: Deployment
    name: message-service
  patch: |-
    - op: replace
      path: /spec/template/spec/volumes/0
      value:
        name: uploads
        emptyDir: {}
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "host=prod-postgres user=messager password=messager dbname=messager_messages sslmode=disable"
- target:
    kind: Deployment
    name: user-service
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "host=prod-postgres user=messager password=messager dbname=messager_users sslmode=disable"
- target:
    kind: Job
    name: migrate-users
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "host=prod-postgres user=messager password=messager dbname=messager_users sslmode=disable"
- target:
    kind: Job
    name: migrate-messages
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "host=prod-postgres user=messager password=messager dbname=messager_messages sslmode=disable"

images:
- name: mablinov2704/frontend
  newTag: latest
- name: mablinov2704/bff
  newTag: latest
- name: mablinov2704/user-service
  newTag: latest
- name: mablinov2704/message-service
  newTag: latest