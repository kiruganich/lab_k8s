apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: messager-prod
resources:
  - ../../base
  - csi-s3.yaml

patches:
  - path: patch-affinity.yaml
  - path: patch-resources.yaml

patchesStrategicMerge:
  - |-
    apiVersion: v1
    kind: Service
    metadata:
      name: frontend
    spec:
      ports:
        - name: http
          nodePort: 30081