apiVersion: v1
kind: PersistentVolume
metadata:
  name: s3-pv-dev
spec:
  capacity:
    storage: 10Gi
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  csi:
    driver: ru.yandex.s3.csi
    volumeHandle: dev-bucket
    nodePublishSecretRef:
      name: messager-secrets
      namespace: messager-dev
    volumeAttributes:
      bucketName: uploads
      endpoint: http://minio.messager-dev.svc.cluster.local:9000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-pvc
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 10Gi
  volumeName: s3-pv-dev
  storageClassName: ""