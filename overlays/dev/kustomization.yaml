apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: messager-dev

resources:
  - ../../base
  - s3-pv-dev.yaml  # Убедись, что этот файл создан в этой же папке

commonLabels:
  environment: dev

images:
  - name: mablinov2704/frontend
    newTag: latest
  - name: mablinov2704/bff
    newTag: latest
  - name: mablinov2704/user-service
    newTag: latest
  - name: mablinov2704/message-service
    newTag: latest

patches:
  - path: patches/replicas.yaml
  - path: patches/resources.yaml
  - path: patches/ingress-host.yaml
  - patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: message-uploads-pvc
      spec:
        volumeName: s3-pv-messager-uploads-dev